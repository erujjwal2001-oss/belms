trigger:
  branches:
    include:
      - master

pool:
  name: Default
  demands:
    - Agent.Name -equals nexa-belms

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'

  apiPublishDir: '$(Build.ArtifactStagingDirectory)\BELMS.Api'
  frontendPublishDir: '$(Build.ArtifactStagingDirectory)\BELMS.Frontend'

  apiDeployPath: 'C:\inetpub\wwwroot\BELMS.Api'
  frontendDeployPath: 'C:\inetpub\wwwroot\BELMS.Frontend'

steps:

# Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '$(dotnetSdkVersion)'
    includePreviewVersions: true

# Restore
- task: DotNetCoreCLI@2
  displayName: 'Restore Solution'
  inputs:
    command: 'restore'
    projects: 'BELMS.slnx'

# Build
- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  inputs:
    command: 'build'
    projects: 'BELMS.slnx'
    arguments: '--configuration $(buildConfiguration)'

# Publish API
- task: DotNetCoreCLI@2
  displayName: 'Publish BELMS.Api'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'BELMS.Api/BELMS.Api.csproj'
    arguments: '--configuration $(buildConfiguration) --output "$(apiPublishDir)"'
    zipAfterPublish: false

# Zip API
- task: ArchiveFiles@2
  displayName: 'Zip BELMS.Api'
  inputs:
    rootFolderOrFile: '$(apiPublishDir)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\BELMS.Api.zip'
    replaceExistingArchive: true

# Publish Frontend
- task: DotNetCoreCLI@2
  displayName: 'Publish BELMS.Frontend'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'BELMS.Frontend/BELMS.Frontend.csproj'
    arguments: '--configuration $(buildConfiguration) --output "$(frontendPublishDir)"'
    zipAfterPublish: false

# Zip Frontend
- task: ArchiveFiles@2
  displayName: 'Zip BELMS.Frontend'
  inputs:
    rootFolderOrFile: '$(frontendPublishDir)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\BELMS.Frontend.zip'
    replaceExistingArchive: true

# Deploy API to IIS
- powershell: |
    Import-Module WebAdministration

    if (Test-Path IIS:\AppPools\BELMS.Api) {
        Stop-WebAppPool "BELMS.Api"
    }

    if (!(Test-Path "$(apiDeployPath)")) {
        New-Item -ItemType Directory -Path "$(apiDeployPath)" | Out-Null
    }

    Remove-Item "$(apiDeployPath)\*" -Recurse -Force -ErrorAction SilentlyContinue
    Copy-Item "$(apiPublishDir)\*" "$(apiDeployPath)" -Recurse -Force

    if (Test-Path IIS:\AppPools\BELMS.Api) {
        Start-WebAppPool "BELMS.Api"
    }
  displayName: 'Deploy API to IIS'

# Deploy Frontend to IIS
- powershell: |
    Import-Module WebAdministration

    if (Test-Path IIS:\AppPools\BELMS.Frontend) {
        Stop-WebAppPool "BELMS.Frontend"
    }

    if (!(Test-Path "$(frontendDeployPath)")) {
        New-Item -ItemType Directory -Path "$(frontendDeployPath)" | Out-Null
    }

    Remove-Item "$(frontendDeployPath)\*" -Recurse -Force -ErrorAction SilentlyContinue
    Copy-Item "$(frontendPublishDir)\*" "$(frontendDeployPath)" -Recurse -Force

    if (Test-Path IIS:\AppPools\BELMS.Frontend) {
        Start-WebAppPool "BELMS.Frontend"
    }
  displayName: 'Deploy Frontend to IIS'

# Publish Artifacts
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'